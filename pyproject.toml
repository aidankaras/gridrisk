[project]
name = "gridrisk"
version = "0.1.0"
description = "Day-ahead ERCOT electricity price volatility forecasting: a GARCH baseline vs. a gradient-boosted-trees model, with a backtested trading strategy and a live dashboard."
readme = "README.md"
license = "MIT"
authors = [
    { name = "aidankaras", email = "amkaras@bu.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "arch>=8.0.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "streamlit>=1.63.0",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
